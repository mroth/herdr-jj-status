id = "mroth.jj-status"
name = "jj status"
version = "0.1.1"
min_herdr_version = "0.7.5"
description = "Show the Jujutsu bookmark and status for jj workspaces in the spaces sidebar"
platforms = ["macos", "linux"]

# One-shot hook after server startup / live handoff: sweep every workspace so
# rows are populated immediately instead of only after you first focus a space.
# NB: herdr still sets HERDR_PLUGIN_CONTEXT_JSON here (the focused workspace);
# bin/refresh.sh sweeps because HERDR_PLUGIN_EVENT is not a per-workspace event,
# not because the context is absent.
[[startup]]
command = ["bash", "bin/refresh.sh"]

# Manual / keybindable refresh. Sweeps every workspace: no HERDR_PLUGIN_EVENT is
# set for actions, so bin/refresh.sh takes the sweep path.
[[actions]]
id = "refresh"
title = "jj status: refresh all"
contexts = ["workspace"]
command = ["bash", "bin/refresh.sh"]

# Event hooks. Each fires a short-lived refresh for the affected workspace
# (herdr passes it via HERDR_PLUGIN_CONTEXT_JSON) — no background process.
# Event names must use the dot form; underscore forms are rejected as unknown.
# workspace.focused is the primary trigger (fires when you switch into a space,
# i.e. exactly when you look at its sidebar row).
[[events]]
on = "workspace.focused"
command = ["bash", "bin/refresh.sh"]

[[events]]
on = "workspace.created"
command = ["bash", "bin/refresh.sh"]

[[events]]
on = "worktree.created"
command = ["bash", "bin/refresh.sh"]

[[events]]
on = "worktree.opened"
command = ["bash", "bin/refresh.sh"]
